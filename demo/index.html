<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MorphCountdown — Demo & Wall of Fame</title>
  
  <!-- lounch styles 
  <link rel="stylesheet" href="../dist/morph-countdown.css">
  <link rel="stylesheet" href="./style.css">
  -->
<style>
    :root {
  --bg-color:#f5efe6;   
  --card-bg:#b8a69d;  
  --text-color: #35130b; 
  --text-muted: #2d201c; 
  --accent-color: #d97706;
  --accent-hover: #b45309;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  line-height: 1.5;
  padding: 2rem 1rem;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 3rem;
}

.header h1 {
  font-size: 2.25rem;
  margin-bottom: 0.5rem;
  background: linear-gradient(to right, #b45309,   var(--text-color) );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.btn {
  display: inline-block;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 500;
  border: 1px solid var(--text-muted);
  color: var(--text-color);
  transition: all 0.2s;
}

.btn:hover {
  border-color: var(--text-color);
  background: rgba(255, 255, 255, 0.05);
}

.btn-primary {
  background: var(--accent-color);
  color: #0f172a;
  border-color: var(--accent-color);
  font-weight: 600;
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.demo-section {
  background: var(--card-bg);
  padding: 2rem;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  margin-bottom: 3rem;
}

.controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
}

.controls label {
  color: var(--text-muted);
  font-size: 0.9rem;
}

.theme-btn {
  background: transparent;
  border: 1px solid var(--text-muted);
  color: var(--text-muted);
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.theme-btn.active, .theme-btn:hover {
  background: var(--accent-color);
  color: #0f172a;
  border-color: var(--accent-color);
  font-weight: 600;
}

.timer-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 150px;
}

.wall-of-fame h2 {
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
}

.wall-of-fame p {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  font-size: 0.95rem;
}

.donors-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
}

.donor-card {
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 1rem;
  border-radius: 10px;
  font-weight: 500;
}

.donor-card span {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
}
</style>  
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>@htochko/morph-countdown</h1>
      <p>A lightweight, customizable SVG morphing countdown component for modern web applications.</p>
      
      <div class="actions">
        <a href="https://github.com/htochko/morph-countdown" target="_blank" class="btn">GitHub</a>
        <a href="https://www.sandbox.paypal.com/cgi-bin/webscr?cmd=_donations&business=sb-2niys53759704@business.example.com&item_name=MorphCountdown%20Support%20%26%20License&currency_code=EUR&amount=10.00" target="_blank" class="btn btn-primary">Remove Branding / Donate</a>
      </div>
    </header>

    <!-- Timer block -->
    <section class="demo-section">
      <!-- Theme choice  
      <div class="controls">
        <label>Theme:</label>
        <button class="theme-btn active" data-theme="leaf">Leaf</button>
        <button class="theme-btn" data-theme="flower">Flower</button>
        <button class="theme-btn" data-theme="snowflake">Snowflake</button>
      </div>
    -->
      <div class="timer-wrapper">
        <div id="countdown-target"></div>
      </div>
    </section>

    <!-- Wall of Fame -->
    <section class="wall-of-fame">
      <h2>Wall of Fame 🌟</h2>
      <p>Huge thanks to everyone who supported the development and removed the "Powered by" badge!</p>
      
      <div id="donors-grid" class="donors-grid">
        <!-- donors.json -->
        <div class="donor-card skeleton">Loading supporters...</div>
      </div>
    </section>
  </main>

  <!-- script -->
  <script type="module" src="./app.js"></script>
</body>
</html>
